
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind Form Validation</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center min-h-screen">
    <div class="bg-[#466245] p-8 rounded-lg shadow-lg w-96">
        <h2 class="text-2xl font-bold text-center mb-6">Registration Form</h2>
        <form id="myForm" onsubmit="return validateForm()">
            <!-- Name -->
            <div class="mb-4">
                <label class="block font-medium text-white mb-2">First_Name</label>
                <input
                    type="text"
                    id="First_name"
                    class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your First_name"
                >
                <p id="nameError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <!-- Email -->
            <div class="mb-4">
                <label class="block font-medium text-white mb-2">Email</label>
                <input
                    type="text"
                    id="email"
                    class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your email"
                >
                <p id="emailError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <!-- Password -->
            <div class="mb-4">
                <label class="block font-medium text-white mb-2">Password</label>
                <input
                    type="password"
                    id="password"
                    class="w-full border border-gray-300 rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Enter your password"
                >
                <p id="passwordError" class="text-red-500 text-sm mt-1"></p>
            </div>
            <!-- Submit Button -->
            <button
                type="submit"
                class="w-full bg-[#FFFDD0] text-black py-2 rounded-md hover:bg-[#E2D7AB] transition"
            >
                Submit
            </button>
        </form>
    </div>
</body>
</html>
