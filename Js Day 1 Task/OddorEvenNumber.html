<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positive or Negative</title>
</head>
<body>
    <h1>Odd or Even</h1>
    <p id="result"></p>
    <script>
        let number = 17;
		if(number%2==0){
		document.write("Even number");
		}
		else{
		document.write("Odd number");
		}		
    </script>
</body>
</html>
