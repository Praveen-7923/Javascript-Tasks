
<!DOCTYPE html>
<html>
<head>SUBJECT<br><hr>
    <title>JS TASK-4</title>
</head>
<body>

<script>

    var sub1 = 80;
    var sub2 = 60;
    var sub3 = 70;
    var sub4 = 100;
    var sub5 = 90;

    var mark = sub1 + sub2 + sub3 + sub4 + sub5;
    var avg = mark / 5;

    document.write("Total Mark: " + mark + "<br>");
    document.write("Average: " + avg + "<br>");

    if (avg >= 90 && avg <= 100) {
        document.write("O Grade");
    } else if (avg >= 75 && avg < 90) {
        document.write("A Grade");
    } else if (avg >= 60 && avg < 75) {
        document.write("B Grade");
    } else if (avg >= 50 && avg < 60) {
        document.write("C Grade");
    } else if (avg >= 40 && avg < 50) {
        document.write("D Grade");
    } else {
        document.write("Fail");
    }
	

	
</script>

</body>
</html>
