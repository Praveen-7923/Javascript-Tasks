<html>
<head>
<title>if</title>
</head>
<body>
<script>
//odd or even
	num=6
	if(num%2==0)
	{
	document.write("even")
	}
	else
	{           
	document.write("odd")
	}
	
//postive or negative	
	a=1
	if(a>0)
	{
	document.write("positive")
	}
	else
	{
	document.write("negative")
	}
	
	// grade
	mark=83
	if(mark>0&& mark<=40)
	{
	document.write("F GRADE")
	}
	else if(mark>=41&& mark<=60)
	{
	document.write("B GRADE")
	}
	else if(mark>=61&& mark<=80)
	{
	document.write("D GRADE")
	}
	else if(mark>=81&& mark<=90)
	{
	document.write("O GRADE")
	}
	else if(mark>=91&& mark<=100)
	{
	document.write("A GRADE")
	}
	else
	{
	document.write("invalid")
	}
	
	//leap year
	year=2022
	if((year % 4==0 && year% 100!=0 )|| (year % 400 == 0))
	{
	document.write("leap year")
	}
	else
	{  
	document.write("non-leap year")
	}
	
	age=8
	if(age>=18)
	{
	document.write("eligable to vote")
	}
	else
	{  
	document.write(" not eligable to vote")
	}
	
	//which is greatest
	let a = 10;
	let b = 20;
	let c = 30;

	if (a >= b && a >= c) 
	{
		document.write("a is greatest: " + a);
	} 
	else if (b >= a && b >= c) 
	{
		document.write("b is greatest: " + b);
	}
	 else
	{
		document.write("c is greatest: " + c);
	}
	
	
	
</script>
</body>
</html>
