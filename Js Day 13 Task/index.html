
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navbar Search</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100">
<!-- Navbar -->
<nav class="bg-[#FFF8F2] text-[#5A3D2B] p-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <!-- Logo -->
        <h1 class="text-2xl font-bold">
            Frost & Fudge
        </h1>
        <!-- Menu -->
        <div class="flex items-center gap-6">
            <a href="#" class="hover:text-yellow-200">Home</a>
            <a href="#" class="hover:text-yellow-200">Ice Cream</a>
            <a href="#" class="hover:text-yellow-200">Sundaes</a>
            <!-- Search -->
            <div class="relative">
                <input
                    type="text"
                    id="search"
                    placeholder="Search..."
                    class="px-4 py-2 rounded-full text-black w-64 outline-none">
                <!-- Suggestions -->
                <div id="result"
                     class="absolute top-12 left-0 bg-white text-black rounded shadow-lg w-full hidden">
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</nav>
</body>
</html>
